[package]
name = "vaultguard"
version = "0.1.0"
description = "On-chain security threat registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vaultguard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"

[dev-dependencies]
anchor-lang = "0.30.1"

[profile.release]
overflow-checks = true
